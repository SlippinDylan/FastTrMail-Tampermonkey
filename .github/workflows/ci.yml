name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - README.en.md
      - LICENSE
      - docs/**
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - README.en.md
      - LICENSE
      - docs/**

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Verify userscript build
        run: npm run build
